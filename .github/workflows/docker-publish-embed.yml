name: Publish Docker Image (Embed)

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-embed:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'EBISPOT' }}
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/ebispot/ols4-embed
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push ols4 embed Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./dataload/embeddings
          file: ./dataload/embeddings/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          build-args: ""
          tags: |
            ghcr.io/ebispot/ols4-embed:${{ github.sha }}
            ghcr.io/ebispot/ols4-embed:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the published embedding image by digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/ebispot/ols4-embed@${{ steps.build.outputs.digest }}
          format: 'json'
          output: 'trivy-full-ols4-embed.json'
          scanners: 'vuln'
          vuln-type: 'os,library'
          timeout: '10m'

      - name: Generate embedding image code scanning results
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/ebispot/ols4-embed@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results-ols4-embed.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          ignore-unfixed: true
          scanners: 'vuln'
          vuln-type: 'os,library'
          timeout: '10m'

      - name: Upload full embedding vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-full-ols4-embed
          path: trivy-full-ols4-embed.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload embedding results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-ols4-embed.sarif
          category: container-ols4-embed
