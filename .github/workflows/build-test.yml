name: Build & Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free up disk space on GH actions runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          sudo apt-get clean
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dataload image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dataload/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ols4-dataload:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ols4-backend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ols4-frontend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build apitester4 image
        uses: docker/build-push-action@v5
        with:
          context: ./apitester4
          file: ./apitester4/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ols4-apitester4:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save images as artifacts
        run: |
          docker save ols4-dataload:local ols4-backend:local ols4-frontend:local ols4-apitester4:local | gzip > ols4-images.tar.gz

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: ols4-images
          path: ols4-images.tar.gz
          retention-days: 1

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Free up disk space on GH actions runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          sudo apt-get clean
          df -h

      - uses: actions/checkout@v4

      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: ols4-images

      - name: Load Docker images
        run: |
          gunzip -c ols4-images.tar.gz | docker load
          echo "OLS4_DATALOAD_IMAGE=ols4-dataload:local" >> $GITHUB_ENV
          echo "OLS4_BACKEND_IMAGE=ols4-backend:local" >> $GITHUB_ENV
          echo "OLS4_FRONTEND_IMAGE=ols4-frontend:local" >> $GITHUB_ENV
          echo "OLS4_APITESTER_IMAGE=ols4-apitester4:local" >> $GITHUB_ENV

      - name: Run API tests
        run: ./test_api.sh
