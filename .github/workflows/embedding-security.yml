name: Embedding Security Tests

on:
  push:
    branches: [dev, stable]
    paths:
      - 'dataload/embeddings/**'
      - '!dataload/embeddings/**/*.md'
      - '.github/workflows/embedding-security.yml'
      - '.github/workflows/docker-publish-embed.yml'
  pull_request:
    paths:
      - 'dataload/embeddings/**'
      - '!dataload/embeddings/**/*.md'
      - '.github/workflows/embedding-security.yml'
      - '.github/workflows/docker-publish-embed.yml'

jobs:
  embedding-security:
    name: Embedding model trust contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.28'
      - name: Install CPU test dependencies constrained by the runtime lock
        run: |
          uv venv --python 3.13 .embedding-test-venv
          uv export --frozen --no-dev --no-emit-project --no-hashes --project dataload/embeddings/ols_embed --output-file "$RUNNER_TEMP/embedding-constraints.txt" > /dev/null
          uv pip install --python .embedding-test-venv/bin/python --torch-backend cpu --constraint "$RUNNER_TEMP/embedding-constraints.txt" sentence-transformers anyio flask polars-u64-idx
      - name: Test model trust and embedding call sites without model weights
        run: .embedding-test-venv/bin/python -m unittest discover -s dataload/embeddings/tests -v
