name: Build & Test

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Determine if we should push to registry
  check-branch:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'EBISPOT' }}
    outputs:
      should-push: ${{ steps.check.outputs.should-push }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/dev" || "${{ github.ref }}" == "refs/heads/stable" || "${{ github.ref }}" == "refs/heads/nextflow") ]]; then
            echo "should-push=true" >> $GITHUB_OUTPUT
          else
            echo "should-push=false" >> $GITHUB_OUTPUT
          fi

  # Build and push images for dev/stable/nextflow branches
  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [check-branch]
    if: ${{ needs.check-branch.outputs.should-push == 'true' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [dataload, backend, frontend, apitester4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/ebispot/ols4-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push ols4 ${{ matrix.component }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component == 'frontend' && './frontend' || (matrix.component == 'apitester4' && './apitester4' || '.') }}
          file: ${{ matrix.component == 'frontend' && './frontend/Dockerfile' || format('./{0}/Dockerfile', matrix.component) }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ebispot/ols4-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/ebispot/ols4-${{ matrix.component }}:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build images locally for PRs and other branches (no push)
  build-local:
    runs-on: ubuntu-latest
    needs: [check-branch]
    if: ${{ needs.check-branch.outputs.should-push == 'false' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dataload image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dataload/Dockerfile
          load: true
          tags: ols4-dataload:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          load: true
          tags: ols4-backend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: ols4-frontend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build apitester4 image
        uses: docker/build-push-action@v5
        with:
          context: ./apitester4
          file: ./apitester4/Dockerfile
          load: true
          tags: ols4-apitester4:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save images as artifacts
        run: |
          docker save ols4-backend:local ols4-frontend:local ols4-apitester4:local | gzip > ols4-images.tar.gz

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: ols4-images
          path: ols4-images.tar.gz
          retention-days: 1

  # API tests for pushed images (dev/stable/nextflow)
  testApi-pushed:
    name: API Tests (Registry)
    runs-on: ubuntu-latest
    needs: [check-branch, build-and-push-image]
    if: ${{ needs.check-branch.outputs.should-push == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Docker images
        run: |
          docker pull ghcr.io/ebispot/ols4-backend:${{ github.sha }}
          docker pull ghcr.io/ebispot/ols4-frontend:${{ github.sha }}
          docker pull ghcr.io/ebispot/ols4-apitester4:${{ github.sha }}
          echo "OLS4_BACKEND_IMAGE=ghcr.io/ebispot/ols4-backend:${{ github.sha }}" >> $GITHUB_ENV
          echo "OLS4_FRONTEND_IMAGE=ghcr.io/ebispot/ols4-frontend:${{ github.sha }}" >> $GITHUB_ENV
          echo "OLS4_APITESTER_IMAGE=ghcr.io/ebispot/ols4-apitester4:${{ github.sha }}" >> $GITHUB_ENV
      - name: Run API tests
        run: ./test_api.sh

  # API tests for local images (PRs and other branches)
  testApi-local:
    name: API Tests (Local)
    runs-on: ubuntu-latest
    needs: [check-branch, build-local]
    if: ${{ needs.check-branch.outputs.should-push == 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: ols4-images
      - name: Load Docker images
        run: |
          gunzip -c ols4-images.tar.gz | docker load
          echo "OLS4_BACKEND_IMAGE=ols4-backend:local" >> $GITHUB_ENV
          echo "OLS4_FRONTEND_IMAGE=ols4-frontend:local" >> $GITHUB_ENV
          echo "OLS4_APITESTER_IMAGE=ols4-apitester4:local" >> $GITHUB_ENV
      - name: Run API tests
        run: ./test_api.sh
