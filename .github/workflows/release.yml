name: Publish stable release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release tag (vX.Y.Z)
        required: true
        type: string

concurrency:
  # Manual recovery shares the caller's stable queue. Reusable calls already
  # hold that lock and need a different group here.
  group: ${{ github.event_name == 'workflow_dispatch' && 'ols-stable-release' || format('ols-release-{0}', github.run_id) }}
  queue: max

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: >-
      github.repository == 'EBISPOT/ols4' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/stable'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          path: workflow
          persist-credentials: false
          sparse-checkout: .github/release
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare or recover release
        id: prepare
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          args=(--commit "$(git rev-parse HEAD)")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            args+=(--release-tag "$RECOVERY_TAG")
          fi
          python ../workflow/.github/release/release.py prepare "${args[@]}"
      - name: Confirm source release and Zenodo DOI
        run: python ../workflow/.github/release/release.py archive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build versioned images and record their digests
        if: steps.prepare.outputs.complete != 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ steps.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          for component in backend frontend dataload apitester4; do
            if [ -f ".release-output/image-${component}.json" ]; then
              echo "Reusing completed ${component} image"
              continue
            fi
            context=.
            target=()
            if [ "$component" = frontend ]; then context=./frontend; fi
            if [ "$component" = apitester4 ]; then context=./apitester4; fi
            if [ "$component" = dataload ]; then target=(--target runtime); fi
            docker buildx build "$context" --file "${component}/Dockerfile" \
              "${target[@]}" --platform linux/amd64,linux/arm64 --push \
              --tag "ghcr.io/ebispot/ols4-${component}:${RELEASE_TAG}" \
              --label "org.opencontainers.image.version=${RELEASE_VERSION}" \
              --label "org.opencontainers.image.revision=${RELEASE_COMMIT}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --cache-from "type=registry,ref=ghcr.io/ebispot/ols4-${component}:release-buildcache" \
              --cache-to "type=registry,mode=max,ref=ghcr.io/ebispot/ols4-${component}:release-buildcache" \
              --metadata-file ".release-output/build-${component}.json"
            python ../workflow/.github/release/release.py remember-image --component "$component" \
              --metadata ".release-output/build-${component}.json"
          done
      - name: Finish release with image digests and citation metadata
        run: python ../workflow/.github/release/release.py finish
      - name: Promote completed release images to stable
        if: github.event_name == 'push' && steps.prepare.outputs.adopted != 'true'
        run: |
          set -euo pipefail
          # Re-running after a failed promotion uses the recorded digests.
          # An old run must not move stable backwards after a newer release.
          git fetch origin stable
          latest=$(git rev-parse origin/stable)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'Stable has advanced; versioned release is available without changing stable aliases'
            exit 0
          fi
          for component in backend frontend dataload apitester4; do
            image=$(python -c 'import json,sys; print(json.load(open(".release-output/release-manifest.json"))["images"][sys.argv[1]])' "$component")
            docker buildx imagetools create --tag "ghcr.io/ebispot/ols4-${component}:stable" "$image"
          done
      - name: Release summary
        if: success()
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Deployment remains a separate action. Use the release image tags or recorded digests.' >> "$GITHUB_STEP_SUMMARY"
