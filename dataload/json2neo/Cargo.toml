[package]
name = "ols_json2neo"
version = "1.0.0"
edition = "2024"
rust-version = "1.90.0"

[[bin]]
name = "ols_json2neo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
parquet = "54.1"
arrow = { version = "54.1", features = ["ffi"] }
thiserror = "2.0"
indexmap = { version = "2.7", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
