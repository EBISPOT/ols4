
spring.aop.proxy-target-class=true

spring.jackson.serialization.INDENT_OUTPUT=true

springdoc.swagger-ui.path=/swagger-ui-ols4.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.layout=BaseLayout

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

server.error.whitelabel.enabled=false

# this is optional. This property will determine the max page size for search results. By default its 1000 rows
ols.search.max-rows=1000

spring.ai.mcp.server.sse-endpoint=/api/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/api/mcp/message

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/api/mcp

# PostgreSQL configuration
ols.postgres.host=${OLS_POSTGRES_HOST:localhost}
ols.postgres.port=${OLS_POSTGRES_PORT:5432}
ols.postgres.db=${OLS_POSTGRES_DB:ols4}
ols.postgres.user=${OLS_POSTGRES_USER:postgres}
ols.postgres.password=${OLS_POSTGRES_PASSWORD:}
ols.postgres.schema=${OLS_POSTGRES_SCHEMA:}
# HikariCP pool sizing: 10/2 was too small for prod (3 pods x 10 = 30 conns) and would
# exhaust under any transient slowdown, cascading into 30s connection-wait 500s cluster-wide.
ols.postgres.max-pool-size=${OLS_POSTGRES_MAX_POOL_SIZE:30}
ols.postgres.min-idle=${OLS_POSTGRES_MIN_IDLE:5}
